    "DOMContentLoaded",
    function() {

        /* ====================================================
           RETAILER DATA
           ==================================================== */

g": 116.356157}, {"name": "CV Duta Agro", "lat": -8.586047, "lng": 116.508724}, {"name": "UD Galvia", "lat": -8.789046, "lng": 116.479736}];


        /* ====================================================
           GET FOLIUM MAP
           ==================================================== */

        var mapObject = null;


        for (
            var key in window
        ) {

            if (
                key.indexOf("map_") === 0 &&
                window[key] &&
                typeof window[key].setView === "function"
            ) {

                mapObject = window[key];

                break;

            }

        }


        if (!mapObject) {

            console.log(
                "Folium map object not found."
            );

            return;

        }


        /* ====================================================
           SEARCH ELEMENTS
           ==================================================== */

        var input =
            document.getElementById(
                "retailer-search-box"
            );


        var results =
            document.getElementById(
                "retailer-search-results"
            );


        var clearButton =
            document.getElementById(
                "retailer-search-clear"
            );


        /* ====================================================
           NORMALIZE TEXT
           ==================================================== */

        function normalize(text) {

            return String(text)
                .toLowerCase()
                .trim();

        }


        /* ====================================================
           HIDE RESULTS
           ==================================================== */

        function hideResults() {

            results.style.display =
                "none";

        }


        /* ====================================================
           SEARCH
           ==================================================== */

        function performSearch() {

            var query =
                normalize(
                    input.value
                );


            if (query.length === 0) {

                hideResults();

                clearButton.style.display =
                    "none";

                return;

            }


            clearButton.style.display =
                "block";


            var matches =
                retailers.filter(
                    function(retailer) {

                        return normalize(
                            retailer.name
                        ).indexOf(query) !== -1;

                    }
                );


            /* ------------------------------------------------
               Maximum 10 search results
               ------------------------------------------------ */

            matches =
                matches.slice(
                    0,
                    10
                );


            results.innerHTML =
                "";


            /* ------------------------------------------------
               No results
               ------------------------------------------------ */

            if (
                matches.length === 0
            ) {

                results.innerHTML =
                    '<div class="search-no-result">' +
                    'No toko found' +
                    '</div>';

                results.style.display =
                    "block";

                return;

            }


            /* ------------------------------------------------
               Results
               ------------------------------------------------ */

            matches.forEach(
                function(retailer) {

                    var result =
                        document.createElement(
                            "div"
                        );


                    result.className =
                        "retailer-search-result";


                    result.innerHTML =
                        '<div class="search-result-name">' +
                        retailer.name +
                        '</div>' +

                        '<div class="search-result-location">' +
                        'Tap to view location' +
                        '</div>';


                    result.addEventListener(
                        "click",
                        function() {

                            input.value =
                                retailer.name;

                            openRetailer(
                                retailer
                            );

                        }
                    );


                    results.appendChild(
                        result
                    );

                }
            );


            results.style.display =
                "block";

        }


        /* ====================================================
           OPEN RETAILER
           ==================================================== */

        function openRetailer(
            retailer
        ) {

            var lat =
                retailer.lat;

            var lng =
                retailer.lng;


            /* ------------------------------------------------
               Zoom to retailer
               ------------------------------------------------ */

            mapObject.setView(
                [lat, lng],
                16,
                {
                    animate: true
                }
            );


            hideResults();


            /*
             * Clear button remains visible because
             * a search is currently active.
             */

            clearButton.style.display =
                "block";


            /*
             * Try to find and open the marker popup.
             *
             * We search through all Leaflet layers.
             */

            var foundMarker =
                null;


            mapObject.eachLayer(
                function(layer) {

                    if (
                        foundMarker
                    ) {

                        return;

                    }


                    if (
                        typeof layer.getLatLng ===
                        "function"
                    ) {

                        var position =
                            layer.getLatLng();


                        var latDiff =
                            Math.abs(
                                position.lat - lat
                            );


                        var lngDiff =
                            Math.abs(
                                position.lng - lng
                            );


                        if (
                            latDiff < 0.00001 &&
                            lngDiff < 0.00001
                        ) {

                            foundMarker =
                                layer;

                        }

                    }

                }
            );


            /*
             * Open popup after zoom animation.
             */

            if (
                foundMarker &&
                typeof foundMarker.openPopup ===
                "function"
            ) {

                setTimeout(
                    function() {

                        foundMarker.openPopup();

                    },
                    700
                );

            }

        }


        /* ====================================================
           INPUT EVENT
           ==================================================== */

        input.addEventListener(
            "input",
            performSearch
        );


        /* ====================================================
           ENTER KEY
           ==================================================== */

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key !== "Enter"
                ) {

                    return;

                }


                var query =
                    normalize(
                        input.value
                    );


                if (
                    query.length === 0
                ) {

                    return;

                }


                /*
                 * Exact match first.
                 */

                var exactMatch =
                    retailers.find(
                        function(retailer) {

                            return normalize(
                                retailer.name
                            ) === query;

                        }
                    );


                if (
                    exactMatch
                ) {

                    openRetailer(
                        exactMatch
                    );

                    return;

                }


                /*
                 * Otherwise use first
                 * partial match.
                 */

                var partialMatch =
                    retailers.find(
                        function(retailer) {

                            return normalize(
                                retailer.name
                            ).indexOf(query) !== -1;

                        }
                    );


                if (
                    partialMatch
                ) {

                    openRetailer(
                        partialMatch
                    );

                }

            }
        );


        /* ====================================================
           CLEAR BUTTON
           ==================================================== */

        clearButton.addEventListener(
            "click",
            function() {

                input.value =
                    "";

                clearButton.style.display =
                    "none";

                hideResults();

                input.focus();

            }
        );


        /* ====================================================
           CLICK OUTSIDE SEARCH
           ==================================================== */

        document.addEventListener(
            "click",
            function(event) {

                var container =
                    document.getElementById(
                        "retailer-search-container"
                    );


                if (
                    !container.contains(
                        event.target
                    )
                ) {

                    hideResults();

                }

            }
        );

    }

);
